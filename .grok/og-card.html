<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: CoverSerif;
      src: url("CoverSerif.ttf") format("truetype");
      font-weight: 700;
    }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #07070A;
    }
    .stage {
      position: relative;
      width: 1200px;
      height: 630px;
    }
    .title {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -52%);
      margin: 0;
      padding: 0 0 0 0.2em;
      font-family: CoverSerif, "Liberation Serif", Georgia, serif;
      font-weight: 700;
      font-size: 108px;
      letter-spacing: 0.2em;
      color: #F3E8D8;
      text-shadow:
        0 1px 0 #1A3A32,
        0 3px 0 #7A1218,
        0 10px 28px rgba(7, 7, 10, 0.85),
        0 0 42px rgba(122, 18, 24, 0.35);
      white-space: nowrap;
      pointer-events: none;
      z-index: 5;
    }
    .scan {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(7, 7, 10, 0) 0px,
        rgba(7, 7, 10, 0) 3px,
        rgba(94, 196, 200, 0.045) 3px,
        rgba(94, 196, 200, 0.045) 4px
      );
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 6;
    }
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 42%, rgba(7,7,10,0) 28%, rgba(7,7,10,0.45) 68%, rgba(7,7,10,0.88) 100%);
      pointer-events: none;
      z-index: 4;
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 1200 630" width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#07070A"/>
          <stop offset="42%" stop-color="#0C1614"/>
          <stop offset="78%" stop-color="#1A3A32"/>
          <stop offset="100%" stop-color="#0A1210"/>
        </linearGradient>
        <radialGradient id="bloodMoon" cx="78%" cy="18%" r="28%">
          <stop offset="0%" stop-color="#7A1218" stop-opacity="0.85"/>
          <stop offset="35%" stop-color="#7A1218" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#7A1218" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="monitorWash" cx="50%" cy="38%" r="38%">
          <stop offset="0%" stop-color="#5EC4C8" stop-opacity="0.22"/>
          <stop offset="55%" stop-color="#5EC4C8" stop-opacity="0.06"/>
          <stop offset="100%" stop-color="#5EC4C8" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="eyeHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#5EC4C8" stop-opacity="0.95"/>
          <stop offset="40%" stop-color="#5EC4C8" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="#5EC4C8" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="bodyShade" cx="38%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#F8E4A8"/>
          <stop offset="55%" stop-color="#F4D27A"/>
          <stop offset="100%" stop-color="#C9A24E"/>
        </radialGradient>
        <radialGradient id="headShade" cx="40%" cy="32%" r="70%">
          <stop offset="0%" stop-color="#F8E4A8"/>
          <stop offset="60%" stop-color="#F4D27A"/>
          <stop offset="100%" stop-color="#D4B05A"/>
        </radialGradient>
        <radialGradient id="maneGrad" cx="40%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#F3C4D4"/>
          <stop offset="55%" stop-color="#E89BB8"/>
          <stop offset="100%" stop-color="#C56E91"/>
        </radialGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="0.6"/>
        </filter>
        <filter id="glowTeal" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="7" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="fogBlur" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur stdDeviation="18"/>
        </filter>
        <filter id="grain">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" result="n"/>
          <feColorMatrix in="n" type="saturate" values="0" result="g"/>
          <feComponentTransfer in="g" result="gg">
            <feFuncA type="linear" slope="0.18"/>
          </feComponentTransfer>
          <feBlend in="SourceGraphic" in2="gg" mode="overlay"/>
        </filter>
      </defs>

      <rect width="1200" height="630" fill="url(#sky)"/>
      <rect width="1200" height="630" fill="url(#bloodMoon)"/>
      <rect width="1200" height="630" fill="url(#monitorWash)"/>

      <!-- distant treeline -->
      <g fill="#10241F" opacity="0.95">
        <path d="M0 290 L40 210 L70 250 L110 170 L150 240 L190 150 L230 230 L280 140 L330 220 L380 130 L430 210 L480 155 L530 230 L580 145 L640 225 L690 135 L740 220 L800 125 L860 215 L920 140 L980 230 L1040 150 L1100 240 L1160 180 L1200 250 L1200 630 L0 630 Z"/>
      </g>
      <g fill="#0E1E1A">
        <path d="M0 340 L30 250 L60 310 L100 220 L140 300 L185 200 L230 290 L280 190 L340 280 L390 185 L450 275 L510 195 L570 285 L630 180 L700 280 L760 175 L830 275 L900 185 L970 290 L1040 200 L1110 300 L1165 230 L1200 310 L1200 630 L0 630 Z"/>
      </g>

      <!-- tall framing pines -->
      <g fill="#081410">
        <g transform="translate(70,430) scale(1.35)">
          <rect x="-8" y="0" width="16" height="90"/>
          <polygon points="0,-210 -58,-40 58,-40"/>
          <polygon points="0,-160 -70,20 70,20"/>
          <polygon points="0,-90 -82,80 82,80"/>
        </g>
        <g transform="translate(160,470) scale(1.05)">
          <rect x="-7" y="0" width="14" height="80"/>
          <polygon points="0,-180 -48,-20 48,-20"/>
          <polygon points="0,-120 -60,30 60,30"/>
          <polygon points="0,-60 -72,80 72,80"/>
        </g>
        <g transform="translate(1040,450) scale(1.25)">
          <rect x="-8" y="0" width="16" height="90"/>
          <polygon points="0,-200 -55,-30 55,-30"/>
          <polygon points="0,-140 -68,25 68,25"/>
          <polygon points="0,-70 -80,85 80,85"/>
        </g>
        <g transform="translate(1145,430) scale(1.45)">
          <rect x="-9" y="0" width="18" height="100"/>
          <polygon points="0,-230 -62,-40 62,-40"/>
          <polygon points="0,-170 -76,20 76,20"/>
          <polygon points="0,-90 -90,90 90,90"/>
        </g>
      </g>

      <!-- fog -->
      <g filter="url(#fogBlur)" opacity="0.28" fill="#F3E8D8">
        <ellipse cx="600" cy="520" rx="420" ry="70"/>
        <ellipse cx="380" cy="470" rx="180" ry="40"/>
        <ellipse cx="860" cy="490" rx="200" ry="46"/>
      </g>

      <!-- ground -->
      <ellipse cx="600" cy="560" rx="280" ry="36" fill="#07070A" opacity="0.55"/>

      <!-- pony -->
      <g id="pony" transform="translate(600, 338)" filter="url(#soft)">
        <!-- tail -->
        <g fill="url(#maneGrad)">
          <ellipse cx="-108" cy="78" rx="46" ry="20" transform="rotate(-28 -108 78)"/>
          <ellipse cx="-138" cy="58" rx="34" ry="16" transform="rotate(-48 -138 58)"/>
          <ellipse cx="-150" cy="88" rx="28" ry="14" transform="rotate(-12 -150 88)"/>
        </g>

        <!-- far wing -->
        <g fill="#E0C36A">
          <ellipse cx="78" cy="42" rx="58" ry="20" transform="rotate(28 78 42)"/>
          <ellipse cx="108" cy="28" rx="28" ry="12" transform="rotate(38 108 28)"/>
          <ellipse cx="96" cy="52" rx="24" ry="11" transform="rotate(18 96 52)"/>
        </g>

        <!-- body -->
        <ellipse cx="4" cy="78" rx="68" ry="52" fill="url(#bodyShade)"/>
        <ellipse cx="14" cy="90" rx="42" ry="32" fill="#F8E0A0" opacity="0.7"/>

        <!-- near wing -->
        <g fill="#F4D27A">
          <ellipse cx="-62" cy="48" rx="54" ry="18" transform="rotate(-24 -62 48)"/>
          <ellipse cx="-92" cy="36" rx="26" ry="11" transform="rotate(-34 -92 36)"/>
          <ellipse cx="-80" cy="58" rx="22" ry="10" transform="rotate(-14 -80 58)"/>
        </g>
        <g fill="#E8C56A" opacity="0.85">
          <path d="M-40 48 Q-90 20 -118 38 Q-86 44 -70 58 Q-52 62 -40 48Z"/>
        </g>

        <!-- legs -->
        <g fill="#E8C56A">
          <rect x="-38" y="110" width="16" height="52" rx="8"/>
          <rect x="-8" y="114" width="15" height="50" rx="8"/>
          <rect x="22" y="112" width="15" height="52" rx="8"/>
          <rect x="48" y="110" width="16" height="54" rx="8"/>
        </g>
        <g fill="#C9A24E">
          <ellipse cx="-30" cy="164" rx="11" ry="6"/>
          <ellipse cx="0" cy="166" rx="10" ry="6"/>
          <ellipse cx="30" cy="166" rx="10" ry="6"/>
          <ellipse cx="56" cy="166" rx="11" ry="6"/>
        </g>

        <!-- neck -->
        <ellipse cx="6" cy="18" rx="28" ry="32" fill="url(#headShade)"/>

        <!-- ears -->
        <g>
          <ellipse cx="-28" cy="-92" rx="14" ry="26" fill="#F4D27A" transform="rotate(-18 -28 -92)"/>
          <ellipse cx="38" cy="-94" rx="14" ry="26" fill="#F4D27A" transform="rotate(16 38 -94)"/>
          <ellipse cx="-28" cy="-90" rx="7" ry="14" fill="#E89BB8" transform="rotate(-18 -28 -90)"/>
          <ellipse cx="38" cy="-92" rx="7" ry="14" fill="#E89BB8" transform="rotate(16 38 -92)"/>
        </g>

        <!-- head -->
        <ellipse cx="6" cy="-52" rx="58" ry="54" fill="url(#headShade)"/>
        <ellipse cx="8" cy="-28" rx="36" ry="26" fill="#F8E0A0"/>

        <!-- mane behind/over head -->
        <g fill="url(#maneGrad)">
          <ellipse cx="-8" cy="-96" rx="36" ry="18" transform="rotate(-8 -8 -96)"/>
          <ellipse cx="-48" cy="-70" rx="28" ry="16" transform="rotate(-40 -48 -70)"/>
          <ellipse cx="-62" cy="-36" rx="22" ry="30" transform="rotate(-12 -62 -36)"/>
          <ellipse cx="48" cy="-78" rx="24" ry="16" transform="rotate(30 48 -78)"/>
          <path d="M-20 -100 C-70 -90 -86 -20 -74 20 C-50 -10 -20 -40 -8 -70 Z"/>
          <path d="M20 -108 C70 -88 74 -20 58 18 C40 -20 18 -50 10 -78 Z"/>
        </g>

        <!-- bow -->
        <g transform="translate(44,-108) rotate(18)">
          <ellipse cx="-16" cy="0" rx="16" ry="11" fill="#E89BB8"/>
          <ellipse cx="16" cy="0" rx="16" ry="11" fill="#E89BB8"/>
          <ellipse cx="0" cy="0" rx="7" ry="7" fill="#C56E91"/>
          <path d="M-4 6 L-10 22 L0 10 L10 22 L4 6 Z" fill="#E89BB8"/>
        </g>

        <!-- cutie-adjacent chest fluff -->
        <ellipse cx="10" cy="70" rx="18" ry="10" fill="#F8E0A0" opacity="0.8"/>

        <!-- face -->
        <!-- left eye (her right): dark, still staring -->
        <g transform="translate(-18,-54)">
          <ellipse cx="0" cy="0" rx="13" ry="16" fill="#F3E8D8"/>
          <ellipse cx="1" cy="1" rx="9" ry="12" fill="#1A3A32"/>
          <ellipse cx="2" cy="-1" rx="4" ry="5" fill="#0A1412"/>
          <circle cx="4" cy="-4" r="2.2" fill="#F3E8D8" opacity="0.7"/>
        </g>

        <!-- right eye (her left): monitor teal, looking too long -->
        <g transform="translate(32,-56)">
          <circle cx="0" cy="0" r="28" fill="url(#eyeHalo)" opacity="0.9"/>
          <ellipse cx="0" cy="0" rx="14" ry="17" fill="#F3E8D8"/>
          <ellipse cx="1" cy="1" rx="10" ry="13" fill="#5EC4C8" filter="url(#glowTeal)"/>
          <ellipse cx="2" cy="0" rx="5" ry="7" fill="#0A1C1C"/>
          <!-- square monitor catchlight -->
          <rect x="3" y="-7" width="5" height="5" fill="#F3E8D8" opacity="0.95"/>
          <rect x="-2" y="2" width="2.5" height="2.5" fill="#F3E8D8" opacity="0.45"/>
        </g>

        <!-- brows, too still -->
        <path d="M-32 -74 Q-18 -80 -6 -74" fill="none" stroke="#C9A24E" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M20 -76 Q34 -82 46 -74" fill="none" stroke="#C9A24E" stroke-width="2.4" stroke-linecap="round"/>

        <!-- nostrils + too-gentle smile -->
        <ellipse cx="2" cy="-18" rx="3" ry="2" fill="#C9A24E"/>
        <ellipse cx="14" cy="-18" rx="3" ry="2" fill="#C9A24E"/>
        <path d="M-6 -8 Q8 -1 22 -8" fill="none" stroke="#C56E91" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
      </g>

      <!-- firefly pixels (inside the game) -->
      <g fill="#5EC4C8">
        <rect x="220" y="180" width="4" height="4" opacity="0.35"/>
        <rect x="980" y="210" width="3" height="3" opacity="0.4"/>
        <rect x="250" y="400" width="3" height="3" opacity="0.25"/>
        <rect x="940" y="360" width="4" height="4" opacity="0.3"/>
        <circle cx="200" cy="300" r="2.2" fill="#F3E8D8" opacity="0.25"/>
        <circle cx="1010" cy="280" r="2.4" fill="#F4D27A" opacity="0.22"/>
      </g>
    </svg>
    <div class="vignette"></div>
    <h1 class="title">WAITING</h1>
    <div class="scan"></div>
  </div>
</body>
</html>
